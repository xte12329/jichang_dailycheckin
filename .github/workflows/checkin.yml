name: "iKUUU Checkin (Browser Auto Login)"

on:
  schedule:
    # 北京时间 09:33 = UTC 01:33（错开整点高峰）
    - cron: "33 1 * * *"
  workflow_dispatch:

concurrency:
  group: ikuuu-checkin-browser
  cancel-in-progress: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 不要写死小版本（如 3.10.16）：Ubuntu 26.04 镜像里找不到该精确版本
          python-version: '3.10'

      - name: Random sleep
        if: github.event_name == 'schedule'
        run: sleep $(shuf -i 10-60 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run checkin
        env:
          IKUUU_EMAIL: ${{ secrets.IKUUU_EMAIL }}
          IKUUU_PASSWD: ${{ secrets.IKUUU_PASSWD }}
          IKUUU_DOMAINS: ${{ vars.IKUUU_DOMAINS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SCKEY: ${{ secrets.SCKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 main.py

      - name: Upload captcha screenshots for debugging
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: captcha-debug
          path: captcha_*.png
          if-no-files-found: ignore
          retention-days: 7
